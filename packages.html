<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebration House - Packages</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hamburger Icon for Mobile -->
    <div class="hamburger-menu">
        <i class="fas fa-bars"></i>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <img src="logo.png" alt="Celebration House Logo">
        </div>
        <ul id="sidebarMenu">
            <!-- Populated by script.js -->
        </ul>
        <div id="logoutSection" style="display: none; padding: 20px;">
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </div>
    <div class="main-content">
        <div class="header">
            <div class="header-overlay"></div>
        </div>
        <div class="container">
            <div class="section active">
                <h2>Our Packages</h2>
                <ul id="packageList">
                    <li data-image="basic_package.jpg" data-price="1499">Basic Package - ₹1499</li>
                    <li data-image="standard_package.jpg" data-price="2499">Standard Package - ₹2499</li>
                    <li data-image="premium_package.jpg" data-price="2999">Premium Package - ₹2999</li>
                    <li data-image="deluxe_package.jpg" data-price="3999">Deluxe Package - ₹3999</li>
                </ul>
                <div id="packageImage">
                    <img src="basic_package.jpg" alt="Package Image">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
